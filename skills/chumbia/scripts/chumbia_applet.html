<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chumbia Archival Applet</title>
  <script src="https://www.gstatic.com/antigravity/web/dev/tailwindcss.min.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  </style>
</head>
<body class="p-3 m-0 bg-transparent text-[var(--foreground,#18181b)] antialiased select-none">
  <div id="card" class="max-w-md mx-auto bg-[var(--card,#ffffff)] border border-[var(--card-border,rgba(16,185,129,0.3))] rounded-2xl p-5 shadow-xl transition-all duration-300">
    <div class="flex items-center gap-3 mb-3">
      <div class="text-3xl">🎺</div>
      <div>
        <h3 class="font-bold text-lg text-[var(--foreground,#18181b)] flex items-center gap-2">
          CHUMBIA! <span class="text-xs px-2 py-0.5 rounded-full bg-emerald-500/15 text-emerald-600 font-mono">TUTTO VERIFICATO</span>
        </h3>
        <p class="text-xs text-[var(--muted-foreground,#71717a)]">Tutti i gate superati: <code>origin/main</code> allineato e pulizie completate.</p>
      </div>
    </div>

    <div class="bg-[var(--secondary,#f4f4f5)] rounded-xl p-3 mb-4 text-xs space-y-1.5 text-[var(--foreground,#3f3f46)]">
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-1.5"><span>✅</span> Working tree &amp; Sequencer</span>
        <span class="text-emerald-600 font-semibold">Pulito</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-1.5"><span>✅</span> Sincronizzazione Main</span>
        <span class="text-emerald-600 font-semibold">0 unpushed</span>
      </div>
      <div class="flex items-center justify-between">
        <span class="flex items-center gap-1.5"><span>🧹</span> Pulizia Worktree &amp; Task</span>
        <span class="text-emerald-600 font-semibold">Completata</span>
      </div>
    </div>

    <div id="action-area" class="flex items-center gap-3">
      <button id="btn-archive" onclick="triggerArchive()" class="flex-1 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-medium py-2.5 px-4 rounded-xl shadow-md transition-all flex items-center justify-center gap-2 text-sm cursor-pointer">
        <span>📦</span> Archivia Chat
      </button>
      <button id="btn-keep" onclick="triggerKeep()" class="bg-[var(--secondary,#f4f4f5)] hover:opacity-80 text-[var(--foreground,#3f3f46)] font-medium py-2.5 px-4 rounded-xl transition-all text-sm cursor-pointer">
        Mantieni Aperta
      </button>
    </div>

    <div id="confirmation" class="hidden mt-3 p-3 bg-blue-500/10 border border-blue-500/30 rounded-xl text-center">
      <p id="confirmation-text" class="text-xs font-semibold text-blue-600"></p>
    </div>
  </div>

  <script>
    async function triggerArchive() {
      const btn = document.getElementById('btn-archive');
      const keepBtn = document.getElementById('btn-keep');
      const conf = document.getElementById('confirmation');
      const confText = document.getElementById('confirmation-text');

      btn.disabled = true;
      keepBtn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      keepBtn.classList.add('opacity-50', 'cursor-not-allowed');

      confText.innerText = "🚀 Segnale di archiviazione inviato! Sigillando la sessione...";
      conf.classList.remove('hidden');

      // Tentativo invio messaggio tramite Antigravity Sidecar Bridge se attivo
      try {
        await fetch('/_sidecar/send-message', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: '/archive' })
        });
      } catch (e) {
        // Fallback: bridge non presente o CORS isolato
      }

      btn.innerHTML = "<span>🔒</span> Sessione Archiviata";
      btn.classList.replace('bg-blue-600', 'bg-emerald-600');
    }

    function triggerKeep() {
      const conf = document.getElementById('confirmation');
      const confText = document.getElementById('confirmation-text');
      confText.innerText = "🟢 Sessione mantenuta attiva. Puoi continuare a chattare.";
      conf.classList.remove('hidden');
    }
  </script>
</body>
</html>
